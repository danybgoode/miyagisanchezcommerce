# Browser smoke — the OPT-IN real-browser layer (NOT the PR gate).
#
# The deterministic gate (ci.yml) stays API-only and chromium-free for speed.
# This runs the `browser` Playwright project (Chromium) on demand and nightly,
# against production by default. It is intentionally anonymous: Clerk's testing
# token is rejected by production Clerk keys. The PR-preview job in ci.yml is
# the only CI path that enables credentialed browser smokes.
#
# The authoritative fixture inventory is e2e/README.md. This workflow wires only
# anonymous browser fixtures; it never enables MS_TEST_BROWSER_AUTH.
name: Browser smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Target base URL (defaults to production)
        required: false
        default: https://miyagisanchez.com
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url || 'https://miyagisanchez.com' }}
      MS_TEST_PERSONALIZED_LISTING_ID: ${{ secrets.MS_TEST_PERSONALIZED_LISTING_ID }}
      MS_TEST_PDP_LISTING_ID: ${{ secrets.MS_TEST_PDP_LISTING_ID }}
      MS_TEST_GALLERY_LISTING_ID: ${{ secrets.MS_TEST_GALLERY_LISTING_ID }}
      MS_TEST_GALLERY_SINGLE_LISTING_ID: ${{ secrets.MS_TEST_GALLERY_SINGLE_LISTING_ID }}
      MS_TEST_GALLERY_ZERO_LISTING_ID: ${{ secrets.MS_TEST_GALLERY_ZERO_LISTING_ID }}
      MS_TEST_CLAIMED_SLUG: ${{ secrets.MS_TEST_CLAIMED_SLUG }}
      MS_TEST_UNCLAIMED_LISTING_ID: ${{ secrets.MS_TEST_UNCLAIMED_LISTING_ID }}
      MS_TEST_GTM_ID: ${{ vars.MS_TEST_GTM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:browser
      - name: Summarize credentialed browser-smoke skips
        if: always()
        run: node scripts/browser-smoke-summary.mjs
      - name: Upload browser-smoke fixture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-fixture-skips
          path: test-results/browser-smoke-fixture-skips.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
